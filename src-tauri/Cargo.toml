[package]
name = "xiaoxin-toolbox"
version = "1.0.1"
description = "小心工具箱 - Windows 桌面快捷工具集"
authors = ["xiaoxin"]
edition = "2021"

[lib]
name = "xiaoxin_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = "0.3"
# png=截图/贴图主格式; bmp=贴图最快路径(零压缩直出); gif=剪贴板GIF贴图解码;
# jpeg=截图 JPG 保存与贴图 JPG 解码
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif", "jpeg"] }
# 录屏 GIF 增量编码（逐帧写入文件流，内存占用恒定）
gif = "0.13"
raw-window-handle = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# 划词翻译：HTTP 客户端 + 有道(sha256)/百度(md5) 签名
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
# 便签背景图 base64 编解码
base64 = "0.22"
rapidocr-core = { version = "0.2.2", default-features = false, features = ["model-download"] }
ignore = "0.4.33"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    # 自提权：TokenElevation 检测（main.rs elevate_if_needed）
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Wdk_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Wdk_System_Threading",
    # 录屏 MP4：Media Foundation H.264 Sink Writer
    "Win32_Media_MediaFoundation",
    # 录屏音频：WASAPI 采集（麦克风 / 系统声音环回）
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # 文字识别已改走 rapidocr-core（PP-OCR ONNX），不再需要 WinRT OCR 相关接口
]

[target.'cfg(windows)'.dependencies.webview2-com]
version = "0.38"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# 开发构建优化第三方依赖：image/gif 的 JPEG 编码与 GIF NeuQuant 量化
# 在未优化下慢一个数量级（录屏实测单帧 300~1600ms，20fps 掉到 ~1fps），
# opt-level=2 后接近 release 速度。代价仅是首次编译依赖稍慢。
[profile.dev.package."*"]
opt-level = 2
