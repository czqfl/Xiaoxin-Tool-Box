[package]
name = "xiaoxin-toolbox"
version = "1.0.1"
description = "小心工具箱 - Windows 桌面快捷工具集"
authors = ["xiaoxin"]
edition = "2021"

[lib]
name = "xiaoxin_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
enigo = "0.3"
# png=截图/贴图主格式; bmp=贴图最快路径(零压缩直出); gif=剪贴板GIF贴图解码
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif"] }
# 录屏 GIF 增量编码（逐帧写入文件流，内存占用恒定）
gif = "0.13"
raw-window-handle = "0.6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
# 划词翻译：HTTP 客户端 + 有道(sha256)/百度(md5) 签名
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
# 便签背景图 base64 编解码
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Wdk_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_WinRT",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Wdk_System_Threading",
    # 截图 OCR（Windows.Media.Ocr 系统引擎）
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Globalization",
    "Foundation",
]

[target.'cfg(windows)'.dependencies.webview2-com]
version = "0.38"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
