<!DOCTYPE html>
<html lang="zh-CN" data-theme="red">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>红色主题预览 · 小心工具箱</title>
<style>
  :root[data-theme="red"] {
    --accent: #cf3a43;
    --accent-hover: #b9333c;
    --accent-active: #9c2932;
    --accent-soft: rgba(207, 58, 67, 0.12);
    --accent-text: #ffffff;
    --danger: #e5484d; --danger-soft: rgba(229,72,77,0.12);
    --success: #2f9270; --success-soft: rgba(47,146,112,0.12);
    --warning: #d97706; --warning-soft: rgba(217,119,6,0.14);
    --accent-rgb: 207, 58, 67;
    --bg-app: #f6eded;
    --bg-panel: rgba(252, 246, 245, 0.86);
    --bg-panel-rgb: 252, 246, 245;
    --bg-elevated: rgba(255, 252, 251, 0.96);
    --bg-input: rgba(255, 250, 249, 0.92);
    --bg-input-glass: rgba(252, 246, 245, 0.4);
    --bg-item-hover: rgba(150, 40, 45, 0.05);
    --bg-item-active: rgba(150, 40, 45, 0.1);
    --bg-badge: rgba(150, 40, 45, 0.06);
    --text-primary: #2a1417;
    --text-secondary: #6b4a4e;
    --text-tertiary: #a3858a;
    --text-inverse: #ffffff;
    --border-subtle: rgba(150, 45, 50, 0.08);
    --border-strong: rgba(150, 45, 50, 0.18);
    --shadow-panel: 0 24px 64px rgba(150,45,50,0.16), 0 4px 16px rgba(150,45,50,0.07);
    --shadow-item: 0 2px 8px rgba(150,45,50,0.07);
    --shadow-card: 0 1px 2px rgba(150,45,50,0.05), 0 6px 20px rgba(150,45,50,0.07);
    --shadow-toolbar: 0 4px 18px rgba(150,45,50,0.18), 0 1px 3px rgba(150,45,50,0.1);
    --switch-knob: #ffffff;
    --ring: 0 0 0 2px rgba(207,58,67,0.28), 0 4px 18px rgba(207,58,67,0.16);
    --panel-highlight: inset 0 1px 0 rgba(255,255,255,0.6);
    --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1100px 560px at 50% -8%, rgba(207,58,67,0.055), transparent 62%), var(--bg-app);
    color: var(--text-primary);
    min-height: 100vh; padding: 32px; -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: var(--text-secondary); margin-bottom: 28px; }
  .panel {
    background: var(--bg-panel); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-xl); box-shadow: var(--shadow-panel), var(--panel-highlight);
    padding: 22px; max-width: 720px; backdrop-filter: blur(20px);
  }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin: 16px 0; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:32px; padding:0 14px; border-radius: var(--radius-md); font-size:13px; font-weight:500;
    border:1px solid var(--border-subtle); background: var(--bg-elevated); color: var(--text-primary);
    cursor:pointer; transition: .15s;
  }
  .btn:hover { background: var(--bg-item-hover); border-color: var(--border-strong); }
  .btn-primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
  .btn-primary:hover { background: var(--accent-hover); }
  .chip { padding:4px 10px; border-radius: 9px; font-size:12px; background: var(--accent-soft); color: var(--accent); }
  .card { background: var(--bg-elevated); border:1px solid var(--border-subtle); border-radius: var(--radius-lg);
    padding:14px; box-shadow: var(--shadow-card); }
  .swatch { width:54px; height:54px; border-radius:12px; box-shadow: var(--shadow-item); }
  .input { height:34px; padding:0 12px; border:1px solid var(--border-subtle); border-radius: var(--radius-md);
    background: var(--bg-input); color: var(--text-primary); }
  .input:focus { border-color: rgba(207,58,67,0.5); box-shadow: var(--ring); outline:none; }
  .switch { width:40px; height:22px; border-radius:11px; background: var(--border-strong); position:relative; }
  .switch.on { background: var(--accent); }
  .switch::after { content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--switch-knob); box-shadow:var(--shadow-item); }
  .switch.on::after { transform: translateX(18px); }
  .toolbar { display:flex; gap:8px; padding:10px; border-radius: var(--radius-lg); background:var(--bg-panel);
    box-shadow: var(--shadow-toolbar), var(--panel-highlight); width:max-content; }
  .ic { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; color:var(--accent); background:var(--accent-soft); font-size:16px; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .label { font-size:12px; color: var(--text-tertiary); margin-bottom:6px; }
</style>
</head>
<body>
  <h1>红色主题预览</h1>
  <p class="sub">有质感的绛红 — 非大红、非暗红 · 暖白底衬托，红更显高级</p>

  <div class="panel">
    <div class="grid2">
      <div class="card">
        <div class="label">品牌色 / 渐变色带</div>
        <div class="row">
          <div class="swatch" style="background:#cf3a43"></div>
          <div class="swatch" style="background:#b9333c"></div>
          <div class="swatch" style="background:#9c2932"></div>
        </div>
        <div class="row">
          <span class="chip">便签</span>
          <span class="chip" style="background:rgba(42,155,180,.13);color:#2a9bb4">文件</span>
          <span class="chip" style="background:rgba(217,119,6,.14);color:#c98d2b">警告</span>
        </div>
      </div>
      <div class="card">
        <div class="label">控件</div>
        <div class="row">
          <button class="btn btn-primary">主按钮</button>
          <button class="btn">次要</button>
          <div class="switch on"></div>
        </div>
        <div class="row">
          <input class="input" placeholder="输入框（聚焦见红环）" />
        </div>
      </div>
    </div>

    <div class="label" style="margin-top:18px">悬浮工具栏（投影 + 红系图标）</div>
    <div class="toolbar" style="margin-top:8px">
      <div class="ic">📋</div>
      <div class="ic" style="color:#d97706">📁</div>
      <div class="ic" style="color:#2f9270">🔑</div>
      <div class="ic" style="color:#b8426f">🌐</div>
      <div class="ic" style="color:#e0623c">🔌</div>
    </div>
  </div>
</body>
</html>
